name: Deploy

# Plan on demand, then apply only after a human approves the run through the
# protected "production" environment. Configure that environment under
# Settings -> Environments with required reviewers, and add the provider
# tokens as environment secrets.

on:
  workflow_dispatch:
    inputs:
      enable_droplet:
        description: "Provision the optional DigitalOcean droplet"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  TF_VERSION: 1.10.0
  TF_VAR_enable_droplet: ${{ inputs.enable_droplet }}
  TF_VAR_project_name: ${{ vars.PROJECT_NAME }}
  TF_VAR_domain: ${{ vars.DOMAIN }}
  TF_VAR_github_repo: ${{ vars.GITHUB_REPO }}
  TF_VAR_supabase_org_id: ${{ vars.SUPABASE_ORG_ID }}
  TF_VAR_digitalocean_ssh_key_id: ${{ vars.DIGITALOCEAN_SSH_KEY_ID }}
  TF_VAR_vercel_api_token: ${{ secrets.VERCEL_API_TOKEN }}
  TF_VAR_supabase_access_token: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
  TF_VAR_cloudflare_api_token: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_digitalocean_token: ${{ secrets.DIGITALOCEAN_TOKEN }}

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: production
    outputs:
      plan_artifact: tfplan
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init -backend=false

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Upload plan
        uses: actions/upload-artifact@v4
        with:
          name: tfplan
          path: tfplan
          retention-days: 5

  apply:
    runs-on: ubuntu-latest
    needs: plan
    # The "production-apply" environment carries the required-reviewers gate,
    # so the apply job pauses for manual approval before it runs.
    environment: production-apply
    steps:
      - uses: actions/checkout@v6

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform init
        run: terraform init -backend=false

      - name: Download plan
        uses: actions/download-artifact@v4
        with:
          name: tfplan

      - name: Terraform apply
        run: terraform apply -input=false tfplan
